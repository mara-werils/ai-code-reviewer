[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "app"]

[project]
name = "pr-reviewer"
version = "0.4.0"
description = "AI-powered code review for GitHub & GitLab. Works with any LLM: GPT-4o, Claude, Llama, Gemini, Ollama. Free, open source."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
keywords = ["code-review", "ai", "llm", "github", "gitlab", "gpt", "claude", "llama", "pre-commit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "httpx>=0.27.0",
    "openai>=1.55.0",
    "anthropic>=0.39.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
selfhosted = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "arq>=0.26.0",
    "pgvector>=0.3.0",
    "PyJWT>=2.9.0",
    "cryptography>=43.0.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "sse-starlette>=2.0.0",
]
playground = [
    "starlette>=0.27.0",
    "uvicorn>=0.30.0",
]
dev = [
    "pr-reviewer[selfhosted]",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "respx>=0.21.0",
    "factory-boy>=3.3.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
pr-reviewer = "src.cli:main"
pr-reviewer-hook = "src.hook:main"

[project.urls]
Homepage = "https://github.com/mara-werils/ai-code-reviewer"
Repository = "https://github.com/mara-werils/ai-code-reviewer"
Issues = "https://github.com/mara-werils/ai-code-reviewer/issues"
Changelog = "https://github.com/mara-werils/ai-code-reviewer/blob/main/CHANGELOG.md"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["A003", "B008", "E501", "TC001", "TC003", "SIM108"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
