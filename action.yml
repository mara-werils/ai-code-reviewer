name: 'AI Code Reviewer'
description: >
  Automated AI code review for pull requests. Works with any LLM: GPT-4o, Claude, Llama, Gemini, Ollama.
  Posts inline comments with severity levels, security checks, suggested fixes, and risk assessment.
  One-line setup, zero config. Free and open source.
author: 'mara-werils'

branding:
  icon: 'code'
  color: 'purple'

inputs:
  github_token:
    description: 'GitHub token for API access (defaults to github.token)'
    required: false
    default: ${{ github.token }}
  provider:
    description: 'LLM provider: openai, anthropic, groq, google, ollama'
    required: false
    default: 'openai'
  model:
    description: 'Model name (auto-selected per provider if empty)'
    required: false
    default: ''
  api_base_url:
    description: 'Custom API base URL (for OpenAI-compatible providers, Ollama, vLLM, LiteLLM)'
    required: false
    default: ''
  language:
    description: 'Language for review comments (en, zh, zh-tw, ja, ko, es, pt, de, fr, ru, it, tr, pl, nl, ar)'
    required: false
    default: 'en'
  review_style:
    description: 'Review style: concise, thorough, minimal'
    required: false
    default: 'concise'
  max_comments:
    description: 'Maximum number of review comments (1-50)'
    required: false
    default: '15'
  custom_instructions:
    description: 'Additional instructions for the reviewer (team conventions, coding standards)'
    required: false
    default: ''
  auto_summarize:
    description: 'Add a PR summary with risk assessment'
    required: false
    default: 'true'
  suggest_tests:
    description: 'Suggest missing test coverage'
    required: false
    default: 'true'
  label_pr:
    description: 'Automatically label PR by type (bugfix, feature, refactor, etc.)'
    required: false
    default: 'false'
  persona:
    description: 'Review persona: default, security-hawk, mentor, nitpicker, quick-scan, dora'
    required: false
    default: ''
  slack_webhook:
    description: 'Slack webhook URL for review notifications'
    required: false
    default: ''
  discord_webhook:
    description: 'Discord webhook URL for review notifications'
    required: false
    default: ''
  check_performance:
    description: 'Run performance anti-pattern detection (20 rules)'
    required: false
    default: 'true'
  check_migrations:
    description: 'Run database migration risk analysis'
    required: false
    default: 'true'
  check_breaking_changes:
    description: 'Detect API breaking changes'
    required: false
    default: 'true'
  check_dependencies:
    description: 'Scan for dependency vulnerabilities and risks'
    required: false
    default: 'true'
  check_metrics:
    description: 'Compute code complexity metrics'
    required: false
    default: 'true'
  check_dead_code:
    description: 'Detect unused imports and unreachable code'
    required: false
    default: 'false'
  check_doc_coverage:
    description: 'Check documentation coverage for public APIs'
    required: false
    default: 'false'
  export_format:
    description: 'Also export review to format: sarif, json, csv, markdown'
    required: false
    default: ''
  auto_approve:
    description: 'Auto-approve low-risk PRs (docs, tests, config changes)'
    required: false
    default: 'false'
  jira_base_url:
    description: 'Jira base URL for ticket linking (e.g., https://company.atlassian.net)'
    required: false
    default: ''
  linear_api_key:
    description: 'Linear API key for issue linking'
    required: false
    default: ''

outputs:
  summary:
    description: 'Review summary text'
  risk_level:
    description: 'Risk level: low, medium, high'
  comments_count:
    description: 'Number of review comments posted'
  cost_usd:
    description: 'Cost of the review in USD'

runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    GITHUB_TOKEN: ${{ inputs.github_token }}
    INPUT_PROVIDER: ${{ inputs.provider }}
    INPUT_MODEL: ${{ inputs.model }}
    INPUT_API_BASE_URL: ${{ inputs.api_base_url }}
    INPUT_LANGUAGE: ${{ inputs.language }}
    INPUT_REVIEW_STYLE: ${{ inputs.review_style }}
    INPUT_MAX_COMMENTS: ${{ inputs.max_comments }}
    INPUT_CUSTOM_INSTRUCTIONS: ${{ inputs.custom_instructions }}
    INPUT_AUTO_SUMMARIZE: ${{ inputs.auto_summarize }}
    INPUT_SUGGEST_TESTS: ${{ inputs.suggest_tests }}
    INPUT_LABEL_PR: ${{ inputs.label_pr }}
    INPUT_PERSONA: ${{ inputs.persona }}
    INPUT_SLACK_WEBHOOK: ${{ inputs.slack_webhook }}
    INPUT_DISCORD_WEBHOOK: ${{ inputs.discord_webhook }}
    INPUT_CHECK_PERFORMANCE: ${{ inputs.check_performance }}
    INPUT_CHECK_MIGRATIONS: ${{ inputs.check_migrations }}
    INPUT_CHECK_BREAKING_CHANGES: ${{ inputs.check_breaking_changes }}
    INPUT_CHECK_DEPENDENCIES: ${{ inputs.check_dependencies }}
    INPUT_CHECK_METRICS: ${{ inputs.check_metrics }}
    INPUT_CHECK_DEAD_CODE: ${{ inputs.check_dead_code }}
    INPUT_CHECK_DOC_COVERAGE: ${{ inputs.check_doc_coverage }}
    INPUT_EXPORT_FORMAT: ${{ inputs.export_format }}
    INPUT_AUTO_APPROVE: ${{ inputs.auto_approve }}
    INPUT_JIRA_BASE_URL: ${{ inputs.jira_base_url }}
    INPUT_LINEAR_API_KEY: ${{ inputs.linear_api_key }}
