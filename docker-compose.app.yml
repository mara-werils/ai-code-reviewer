# Lightweight GitHub App deployment — no Postgres/Redis needed
# Usage: docker compose -f docker-compose.app.yml up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    ports:
      - "8000:8000"
    environment:
      # GitHub App credentials (required)
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      GITHUB_PRIVATE_KEY_PATH: /app/private-key.pem

      # LLM provider (pick one)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}

      # Optional config
      PROVIDER: ${PROVIDER:-}
      MODEL: ${MODEL:-}
      REVIEW_STYLE: ${REVIEW_STYLE:-concise}
      MAX_COMMENTS: ${MAX_COMMENTS:-15}
    volumes:
      - ./private-key.pem:/app/private-key.pem:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
