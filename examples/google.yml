name: AI Code Review (Google Gemini)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mara-werils/ai-code-reviewer@v1
        with:
          provider: 'google'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
