name: AI Code Review (Chinese)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mara-werils/ai-code-reviewer@v1
        with:
          language: 'zh'  # Reviews in Chinese (also: ja, ko, es, de, fr, ru, pt)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
