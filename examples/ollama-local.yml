name: AI Code Review (Ollama - 100% local)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: self-hosted  # Must have Ollama running
    steps:
      - uses: actions/checkout@v4
      - uses: mara-werils/ai-code-reviewer@v1
        with:
          provider: 'ollama'
          model: 'llama3.1:8b'
          api_base_url: 'http://localhost:11434/v1'
