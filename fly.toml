# Deploy to Fly.io:
#   fly launch --config fly.toml
#   fly secrets set GITHUB_APP_ID=... GITHUB_WEBHOOK_SECRET=... GITHUB_PRIVATE_KEY="$(cat private-key.pem)" GROQ_API_KEY=...
#   fly deploy

app = "ai-code-reviewer"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.app"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
