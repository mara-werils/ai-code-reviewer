name: Benchmark

on:
  pull_request:
    paths:
      - 'src/review/security.py'
      - 'tests/eval/**'
  push:
    branches: [main]
    paths:
      - 'src/review/security.py'
      - 'tests/eval/**'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e .

      - name: Run security scanner benchmark
        run: python -m tests.eval.bench

      - name: Post results as comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const output = execSync('python -m tests.eval.bench 2>&1').toString();
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Security Scanner Benchmark\n\n\`\`\`\n${output}\n\`\`\``
            });
