name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy app/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pr_reviewer
          POSTGRES_PASSWORD: pr_reviewer
          POSTGRES_DB: pr_reviewer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system ".[dev]"
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://pr_reviewer:pr_reviewer@localhost:5432/pr_reviewer_test
          REDIS_URL: redis://localhost:6379/0
          GITHUB_WEBHOOK_SECRET: test-secret
          ANTHROPIC_API_KEY: test-key
          OPENAI_API_KEY: test-key
        run: pytest tests/ -v --tb=short -x
