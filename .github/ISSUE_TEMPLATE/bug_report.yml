name: Bug Report
description: Report a problem with AI Code Reviewer
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please fill out the sections below.
  - type: input
    id: provider
    attributes:
      label: LLM Provider
      description: Which provider are you using?
      placeholder: "openai / anthropic / groq / google / ollama"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug clearly.
      placeholder: "The review posted but all comments were on wrong lines..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Workflow file
      description: Paste your workflow YAML (remove secrets).
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Action logs
      description: Paste relevant logs from the GitHub Actions run.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: "Which version are you using? (e.g., v1, v0.3.0)"
      placeholder: "v1"
